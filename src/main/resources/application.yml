spring:
  application:
    name: BrainboxApi
  profiles:
    active: dev
  autoconfigure:
    exclude:
      # DeepSeek requires an API key; re-enable when the agentic pipeline (Phase 7)
      # is wired and DEEPSEEK_API_KEY is provided.
      - org.springframework.ai.model.deepseek.autoconfigure.DeepSeekChatAutoConfiguration
  docker:
    compose:
      enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/brainbox}
    username: ${DB_USER:brainbox}
    password: ${DB_PASSWORD:brainbox}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

server:
  error:
    include-message: never
    include-stacktrace: never
    whitelabel:
      enabled: false
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      # Probe endpoints stay open; component details are only shown to an
      # authenticated caller (the admin role sees the full health tree).
      show-details: when_authorized

app:
  # Calendar zone used to bucket attendance registers (client sends local midnight).
  school-zone: ${SCHOOL_ZONE:Africa/Nairobi}
  # Adaptive-difficulty ONNX model distribution. The operator drops the model file on
  # disk and points ML_MODEL_PATH at it; the API publishes its SHA-256 so the app can
  # verify the bytes before loading them. With no path (or a missing file) the manifest
  # endpoint answers 503 and the app keeps using its rule-based engine.
  ml:
    model:
      path: ${ML_MODEL_PATH:}
      version: ${ML_MODEL_VERSION:1}
      name: ${ML_MODEL_NAME:adaptive_difficulty}
      file-name: ${ML_MODEL_FILE_NAME:adaptive_difficulty.onnx}
  # The admin console (a separate app) is operated with explicit platform permissions, not
  # merely the ADMIN role. No account holds one until it is granted; the first operator is
  # bootstrapped from this list (comma-separated phone numbers of ADMIN accounts) and the
  # application logs a warning while no operator exists. Remove the entry once operators can
  # manage each other. See docs/ongoing/console_security_requirements.md.
  console:
    bootstrap-operator-phones: ${CONSOLE_BOOTSTRAP_OPERATOR_PHONES:}
  # Shared state between API nodes (rate-limit counters, advisory presence). Off by
  # default: the process keeps every counter in memory, which is correct for one node.
  # Setting enabled=true moves that state to Redis with no code change, because callers
  # only ever see SharedStateStore. Failure modes are per feature and chosen for product
  # usability: rate limiting and presence degrade to per-node (ALLOW), while anything
  # security-shaped (a revocation list) refuses when it cannot be read (DENY).
  redis:
    enabled: ${REDIS_ENABLED:false}
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    database: ${REDIS_DATABASE:0}
    username: ${REDIS_USERNAME:}
    password: ${REDIS_PASSWORD:}
    ssl: ${REDIS_SSL:false}
    timeout-millis: ${REDIS_TIMEOUT_MILLIS:2000}
    # One Redis database can serve several environments; every key carries this prefix.
    key-prefix: ${REDIS_KEY_PREFIX:brainbox:}
    failure-mode:
      rate-limit: ${REDIS_FAILURE_RATE_LIMIT:ALLOW}
      presence: ${REDIS_FAILURE_PRESENCE:ALLOW}
      revocation: ${REDIS_FAILURE_REVOCATION:DENY}
  # The public base for links the API hands to clients (served media keys and signed
  # report downloads). Empty keeps the request's own base, which is right for a
  # single-origin deployment. Set it to a CDN, a reverse proxy or the public
  # object-store endpoint and every returned link points there instead; clients treat an
  # absolute URL as final, so no app change is needed. See docs/ongoing/api_cdn_deployment.md.
  public-base-url: ${PUBLIC_BASE_URL:}
  media:
    # Local disk storage for uploaded project media until S3/MinIO (Phase 6).
    local-dir: ${MEDIA_DIR:./data/media}
    # Hard cap for the general image/video/attachment upload path. The format is
    # still detected from the bytes; a file above this is a 400 before storage.
    max-upload-bytes: ${MEDIA_MAX_UPLOAD_BYTES:26214400}
    cache:
      # Media keys are server-generated UUIDs that are never reused, so /media/{key} is
      # immutable. `false` (the default) answers `private, max-age=30d`, which keeps
      # shared caches out; set `true` once a CDN or reverse proxy fronts the deployment
      # and the response becomes `public, max-age=30d, immutable`.
      public: ${MEDIA_CACHE_PUBLIC:false}
      max-age-seconds: ${MEDIA_CACHE_MAX_AGE_SECONDS:2592000}
    url-reputation:
      # URL reputation for URLs the platform stores or fetches (generated figure images,
      # grounding sources). Off by default; a deployment with a provider turns it on here
      # or from the console. `none` records SKIPPED, `deny_list` applies the shared SSRF
      # rules with no external call, `http` calls a provider that answers
      # {"status":"CLEAN"|"MALICIOUS"|"ERROR"}.
      enabled: ${MEDIA_URL_REPUTATION_ENABLED:false}
      provider: ${MEDIA_URL_REPUTATION_PROVIDER:none}
      # A provider outage refuses a URL unless this is true.
      fail-open: ${MEDIA_URL_REPUTATION_FAIL_OPEN:false}
      timeout-millis: ${MEDIA_URL_REPUTATION_TIMEOUT_MILLIS:5000}
      http:
        url: ${MEDIA_URL_REPUTATION_URL:}
        bearer-token: ${MEDIA_URL_REPUTATION_TOKEN:}
    scan:
      # Malware/URL scanning, run after the format check and before an upload is marked
      # VERIFIED, on both the presigned confirm path and the proxied multipart path.
      #   none   (default) accepts the object and records scan_status=SKIPPED
      #   clamav          clamd INSTREAM over TCP (no temp file)
      #   http            a scanner sidecar that answers {"status":"CLEAN"|"INFECTED"|"ERROR"}
      provider: ${MEDIA_SCAN_PROVIDER:none}
      # What an unreachable/broken scanner means. false (default) refuses the upload;
      # true accepts it and records scan_status=ERROR. A deployment that configured a
      # scanner should leave this false.
      fail-open: ${MEDIA_SCAN_FAIL_OPEN:false}
      timeout-millis: ${MEDIA_SCAN_TIMEOUT_MILLIS:15000}
      max-scan-bytes: ${MEDIA_SCAN_MAX_BYTES:26214400}
      clamav:
        host: ${CLAMAV_HOST:127.0.0.1}
        port: ${CLAMAV_PORT:3310}
      http:
        url: ${MEDIA_SCAN_URL:}
        bearer-token: ${MEDIA_SCAN_TOKEN:}
  # Object storage for media uploads and rendered report PDFs. local (the default)
  # keeps the existing media/report directories; s3 routes both through one
  # S3-compatible endpoint (MinIO in-country, or S3) with the media/ and reports/
  # key prefixes. Uploads are proxied through the API node; downloads redirect to a
  # short-lived presigned GET so the bytes come from storage directly. Credentials
  # are required when provider=s3 and the app fails fast if they are missing.
  storage:
    provider: ${STORAGE_PROVIDER:local}
    # Lifetime of a presigned direct-download URL (S3's maximum is 7 days).
    presign-ttl: ${STORAGE_PRESIGN_TTL:10m}
    s3:
      endpoint: ${S3_ENDPOINT:}
      bucket: ${S3_BUCKET:}
      region: ${S3_REGION:us-east-1}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      path-style: ${S3_PATH_STYLE:true}
  auth:
    password-reset:
      # Development only: log the reset code (no SMS/email provider is wired).
      # Production must set AUTH_LOG_OTP=false and plug in a delivery channel.
      log-otp: ${AUTH_LOG_OTP:false}
  reports:
    # Rendered report PDFs, signed-download lifetime, weekly quota and the
    # server-side sync/async thresholds (docs/ongoing/api_reports_changes.md).
    storage-dir: ${REPORT_STORAGE_DIR:./data/reports}
    download-secret: ${REPORT_DOWNLOAD_SECRET:dev-only-report-download-secret-change-me}
    download-ttl: 30m
    # Lifetime per-student export allowance, counted for teacher accounts only;
    # aggregate kinds and learner/parent downloads are unlimited. Multi-student
    # jobs additionally require the Explorer coverage threshold below.
    # docs/ongoing/product_ops_roadmap.md item 1.
    student-report-lifetime-cap: ${REPORT_STUDENT_LIFETIME_CAP:10}
    explorer-coverage-threshold: ${REPORT_EXPLORER_COVERAGE:0.80}
    sync-threshold-rows: 300
    sync-threshold-students: 5
    poll-hint-millis: 2000
    retention-days: 90
  push:
    fcm:
      # FCM HTTP v1 sender (docs/ongoing/api_push_changes.md, LC-1). Token
      # registration always works; without credentials the in-app notification is
      # written but no push is delivered.
      enabled: ${PUSH_FCM_ENABLED:false}
      service-account-file: ${PUSH_FCM_SERVICE_ACCOUNT_FILE:}
      project-id: ${PUSH_FCM_PROJECT_ID:}
      channel-id: system_notifications_channel
  ai:
    # Phase 7.2 generation provider seam. Disabled by default so the API boots
    # and serves the content cache without a model key. When enabled, DeepSeek is
    # always in the pool and the generic OpenAI-compatible endpoint joins it when
    # app.ai.openai.enabled is true. Both speak the same chat-completions wire
    # format; the Spring AI DeepSeek autoconfiguration above stays excluded.
    enabled: ${AI_ENABLED:false}
    routing:
      # CHEAPEST (default) ranks by configured price then observed latency;
      # FASTEST ranks by observed latency then price; CONFIGURED uses bean order.
      # A provider that keeps failing is demoted for cooldown-seconds.
      policy: ${AI_ROUTING_POLICY:CHEAPEST}
      failure-threshold: ${AI_ROUTING_FAILURE_THRESHOLD:3}
      cooldown-seconds: ${AI_ROUTING_COOLDOWN_SECONDS:120}
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      model: ${DEEPSEEK_MODEL:deepseek-chat}
      # Phase 7.5f: model for the independent answer-key solve. Empty means the
      # normal generation model; point DEEPSEEK_VERIFY_MODEL at a second model to
      # make the verification call a genuinely independent second opinion.
      verify-model: ${DEEPSEEK_VERIFY_MODEL:}
      # Price in micros per million tokens, used to price model_calls and to rank
      # the pool. Defaults are the DeepSeek public list price (v3.2).
      prompt-micros-per-million: ${DEEPSEEK_PROMPT_MICROS_PER_MILLION:270000}
      completion-micros-per-million: ${DEEPSEEK_COMPLETION_MICROS_PER_MILLION:1100000}
    openai:
      # Generic OpenAI-compatible endpoint (OpenAI, Azure-compatible gateways,
      # vLLM, Groq, ...). Off until OPENAI_ENABLED=true; set the base URL, key,
      # model and price for the target. A blank/zero price is "unknown" and never
      # wins a cost comparison.
      enabled: ${OPENAI_ENABLED:false}
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      verify-model: ${OPENAI_VERIFY_MODEL:}
      prompt-micros-per-million: ${OPENAI_PROMPT_MICROS_PER_MILLION:0}
      completion-micros-per-million: ${OPENAI_COMPLETION_MICROS_PER_MILLION:0}
  # O1 operations backend. The rollup job aggregates the previous complete hour
  # into ops_metric_rollup (our own database); no external observability service.
  # Retention mirrors the 90-day audit-log window.
  ops:
    rollup:
      enabled: ${OPS_ROLLUP_ENABLED:true}
      interval-ms: ${OPS_ROLLUP_INTERVAL_MS:3600000}
      initial-delay-ms: ${OPS_ROLLUP_INITIAL_DELAY_MS:300000}
      retention-days: ${OPS_ROLLUP_RETENTION_DAYS:90}
  content:
    # Phase 7.5a durable generation queue. api = this JVM enqueues only and a
    # separate worker drains; worker = drain only; both = enqueue and drain in
    # this JVM. The worker owns the run mode; the router never reads it.
    run-mode: ${CONTENT_RUN_MODE:both}
    worker:
      batch-size: ${CONTENT_WORKER_BATCH_SIZE:5}
      # H4: bounded in-JVM parallelism per worker instance. 1 keeps the original
      # sequential pass; 4 is a sensible single-instance start (batch-size at least
      # concurrency). concurrency x worker-instances must stay under the database
      # connection pool and the provider's sustained request rate.
      concurrency: ${CONTENT_WORKER_CONCURRENCY:1}
      max-attempts: ${CONTENT_WORKER_MAX_ATTEMPTS:5}
      stale-run-seconds: ${CONTENT_WORKER_STALE_RUN_SECONDS:900}
      poll-interval-ms: ${CONTENT_WORKER_POLL_INTERVAL_MS:15000}
      retry-backoff-seconds: ${CONTENT_WORKER_RETRY_BACKOFF_SECONDS:60}
    curriculum:
      # Phase 7.5b-1 Tier 0 skeleton. When true, the app seeds the authored
      # Kenya CBC Mathematics G4-G6 catalogue from classpath resource data on
      # ApplicationReadyEvent. Default false so tests and production never seed
      # implicitly; enable deliberately on a fresh environment.
      seed-on-startup: ${CONTENT_CURRICULUM_SEED_ON_STARTUP:false}
    batch:
      # Phase 7.5e Tier 1 batch producer. When run-on-startup is true the
      # ApplicationReadyEvent bootstrap enqueues one job per Tier 0 topic x task
      # type through the durable queue; the worker generates, projects and
      # auto-approves. Default false so tests and production never enqueue
      # implicitly. All settings are also the admin POST /admin/content/batch
      # defaults, except that call takes them explicitly in the body.
      run-on-startup: ${CONTENT_BATCH_RUN_ON_STARTUP:false}
      grade-level: ${CONTENT_BATCH_GRADE_LEVEL:Grade 4}
      subject: ${CONTENT_BATCH_SUBJECT:}
      task-types: ${CONTENT_BATCH_TASK_TYPES:NOTES,QUIZ}
      language: ${CONTENT_BATCH_LANGUAGE:en}
      standard-version: ${CONTENT_BATCH_STANDARD_VERSION:v1}
      limit: ${CONTENT_BATCH_LIMIT:50}
    critique:
      # Phase 7.5 LLM critic. Off by default; when enabled the loop critiques each
      # unit and auto-approval refuses a unit whose score is missing or below
      # min-score.
      enabled: ${CONTENT_CRITIQUE_ENABLED:false}
      min-score: ${CONTENT_CRITIQUE_MIN_SCORE:0.8}
    loop:
      # Phase 7.5 supervisor task loop. 1 reproduces the previous single-shot path;
      # set 2-3 to revise a unit the validators block before it escalates to the
      # human queue. max-cost-micros caps the accumulated provider spend per job
      # (0 disables the cost ceiling).
      max-iterations: ${CONTENT_LOOP_MAX_ITERATIONS:1}
      max-cost-micros: ${CONTENT_LOOP_MAX_COST_MICROS:0}
  payments:
    # M-Pesa subscription payments relayed through IntaSend (doc 14 section 6).
    # Off by default. At deployment, switch sandbox to false and replace the test
    # keys with the live ones through these environment variables; no code or
    # schema change is required. PaymentSecretGuard refuses to start with
    # payments enabled and no usable key/challenge outside the test profile.
    enabled: ${APP_PAYMENTS_ENABLED:false}
    sandbox: ${APP_PAYMENTS_SANDBOX:true}
    currency: ${APP_PAYMENTS_CURRENCY:KES}
    callback-url: ${PAYMENT_CALLBACK_URL:}
    callback-challenge: ${PAYMENT_CALLBACK_CHALLENGE:}
    intasend:
      secret-key: ${INTASEND_SECRET_KEY:}
      publishable-key: ${INTASEND_PUBLISHABLE_KEY:}
      wallet-id: ${INTASEND_WALLET_ID:}
    plans:
      explorer: ${PAYMENTS_PRICE_EXPLORER:100}
      pro: ${PAYMENTS_PRICE_PRO:150}
      upgrade: ${PAYMENTS_PRICE_UPGRADE:50}
      duration-days: ${PAYMENTS_PERIOD_DAYS:30}
  security:
    jwt:
      # Base64-encoded HMAC secret. Override in each environment. Dev default only.
      secret: ${JWT_SECRET:ZGV2LW9ubHktYmFzZTY0LXNlY3JldC1rZXktZG8tbm90LXVzZS1pbi1wcm9kLTIwMjY=}
      issuer: ${JWT_ISSUER:brainbox-api}
      access-token-ttl: 24h
      refresh-token-ttl: 30d
    rate-limit:
      # Token bucket per client IP; override capacity/refill per environment.
      enabled: true
      capacity: 120
      refill-per-second: 2

logging:
  level:
    root: INFO
    com.afrithecus.brainbox.api: INFO
