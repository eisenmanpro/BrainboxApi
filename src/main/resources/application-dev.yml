# Development environment. Mirrors the Android 'dev' flavor expectations.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/brainbox}
    username: ${DB_USER:brainbox}
    password: ${DB_PASSWORD:brainbox}

logging:
  level:
    com.afrithecus.brainbox.api: DEBUG
    org.springframework.security: INFO

# The dev mail transport is the logging sink (no SMTP credentials), so Boot's
# MailHealthIndicator cannot connect and drags /actuator/health to 503. Local
# readiness is the DB/readiness probe; mail is verified on staging/prod.
management:
  health:
    mail:
      enabled: false
