# Fast local integration profile: H2 in PostgreSQL compatibility mode.
# Real PostgreSQL parity is provided by the same Flyway scripts when a Postgres
# datasource is supplied (e.g. via Testcontainers in Docker environments).
spring:
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:h2:mem:brainbox;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  autoconfigure:
    exclude:
      - org.springframework.ai.model.deepseek.autoconfigure.DeepSeekChatAutoConfiguration
  flyway:
    enabled: true
    clean-disabled: false

app:
  # O1 rollup scheduling is off in tests; the O1 tests drive OpsRollupService
  # directly so the hourly job cannot race them.
  ops:
    rollup:
      enabled: false
  content:
    # No background generation poller during tests; the worker tests set
    # app.content.run-mode=both explicitly so they can drive poll() themselves.
    run-mode: api
  security:
    rate-limit:
      enabled: false
  reports:
    # Tests render branded PDFs without fetching remote logos and store them in temp.
    embed-logo: false
    storage-dir: ${java.io.tmpdir}/brainbox-reports-test
