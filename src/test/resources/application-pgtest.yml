# Real-PostgreSQL parity profile: boots the same Flyway scripts + JPA mapping
# against an actual Postgres. Override with DB_URL/DB_USER/DB_PASSWORD (defaults
# match compose.yaml; a local dev cluster on another port overrides via env).
spring:
  docker:
    compose:
      enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/brainbox}
    username: ${DB_USER:brainbox}
    password: ${DB_PASSWORD:brainbox}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: true

app:
  content:
    # No background generation poller during tests; the worker tests set
    # app.content.run-mode=both explicitly so they can drive poll() themselves.
    run-mode: api
  security:
    rate-limit:
      enabled: false
  reports:
    # Tests render branded PDFs without fetching remote logos and store them in temp.
    embed-logo: false
    storage-dir: ${java.io.tmpdir}/brainbox-reports-test
