services:
  postgres:
    image: 'postgres:17'
    container_name: brainbox-postgres
    environment:
      - 'POSTGRES_DB=brainbox'
      - 'POSTGRES_PASSWORD=brainbox'
      - 'POSTGRES_USER=brainbox'
    ports:
      - '5432:5432'
    volumes:
      - brainbox-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U brainbox -d brainbox']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  brainbox-postgres-data:
